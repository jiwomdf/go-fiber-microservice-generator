<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fav-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="fav-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="fav-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="#0F172A" />

  <!-- Core Isometric Cube -->
  <g transform="translate(32, 28)">
    <polygon points="0,-16 16,-8 0,0 -16,-8" fill="url(#fav-top)" />
    <polygon points="-16,-8 0,0 0,16 -16,8" fill="url(#fav-left)" />
    <polygon points="0,0 16,-8 16,8 0,16" fill="url(#fav-right)" />
    <!-- Fiber Speed Core Dot -->
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Accent Nodes -->
  <circle cx="16" cy="46" r="3" fill="#38BDF8" />
  <circle cx="48" cy="46" r="3" fill="#818CF8" />
  <path d="M 16 46 L 32 36 L 48 46" stroke="#4F46E5" stroke-width="1.5" stroke-linecap="round" />
</svg>

